<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TransitFlow</title>
    <meta name="description" content="TransitFlow — lightweight client-side visualization of public transit networks (GTFS).">
    <meta name="theme-color" content="#0A84FF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TransitFlow">

    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="assets/icons/app-icon.svg">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="controls">
    <div class="time-container">
        <label for="time-input"><strong>Time: </strong></label>
        <input type="time" id="time-input" step="1">
    </div>

    <input type="range" id="time-slider" min="0" max="86399" step="any">
    
    <div class="slider-labels">
        <span>00:00</span>
        <span>06:00</span>
        <span>12:00</span>
        <span>18:00</span>
        <span>23:59</span>
    </div>

    <div class="btn-group">
        <button type="button" id="play-pause-btn" title="Play/Pause" aria-label="Play or pause">
            <i class="fas fa-pause" aria-hidden="true"></i>
        </button>
        <select id="speed-selector" title="Playback Speed" aria-label="Playback speed">
            <option value="30" selected>30x</option>
            <option value="60">60x</option>
            <option value="120">120x</option>
        </select>
		<button type="button" class="btn-clear" id="clear-btn" title="Clear Search & Selection" aria-label="Clear search and selection">
        <i class="fas fa-trash-alt" aria-hidden="true"></i>
		</button>
    </div>

    <div class="btn-group">
        <button type="button" id="live-toggle-btn" class="btn-live" title="Toggle live vehicle positions" aria-label="Toggle live positions" aria-pressed="false">
            <i class="fas fa-satellite-dish" aria-hidden="true"></i><span>&nbsp;LIVE</span>
        </button>
    </div>
    <div id="live-status" class="live-status" aria-live="polite" hidden></div>
    
    <div id="search-container">
        <button type="button" class="search-header" id="search-toggle" aria-expanded="false" aria-controls="search-content">
            <span>🔍 SEARCH</span>
            <i id="search-chevron" class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>

        <div id="search-content" hidden>
            <label class="visually-hidden" for="stop-search-input">Stop name or ID</label>
            <input type="text" id="stop-search-input" placeholder="Stop name or ID" autocomplete="off">

            <div class="search-params">
                <label class="visually-hidden" for="search-time-input">Target time</label>
                <input type="time" id="search-time-input">
                <label class="visually-hidden" for="search-window">Window (mins)</label>
                <input type="number" id="search-window" value="10" min="1" max="60" title="Window (mins)">
            </div>

            <div class="search-actions">
                <button type="button" class="btn-find" id="search-find-btn">Find</button>
            </div>

            <div id="search-results" aria-live="polite"></div>
        </div>
    </div>
</div>

<div id="map"></div>
<div id="loading-error" role="alert" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/script.js"></script>
<script src="js/live.js"></script>

<script>
    // Service Worker Registration (relative path: works on sub-path hosting e.g. GitHub Pages)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('TransitFlow Cache Active!'))
                .catch(err => console.error('Cache failed:', err));
        });
    }
</script>

</body>
</html>
